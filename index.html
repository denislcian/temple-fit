<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TMPL — registro de entrenamientos de fuerza. Gratis, sin cuentas, 100% offline y accesible. Tus datos son tuyos."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Tema guardado aplicado antes de pintar: evita el parpadeo si el usuario
         eligió el oscuro. Sin preferencia, queda el claro por defecto (:root). -->
    <script>
      try {
        var t = localStorage.getItem('forjafit-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#f4f8f5" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph / Twitter: vista previa al compartir el enlace. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TMPL" />
    <meta property="og:title" content="TMPL — Tu cuaderno de gimnasio" />
    <meta
      property="og:description"
      content="Registro de entrenamientos de fuerza: gratis, sin cuentas, 100% offline y accesible. Tus datos son tuyos."
    />
    <meta property="og:image" content="./pwa-512.png" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TMPL — Tu cuaderno de gimnasio" />
    <meta
      name="twitter:description"
      content="Registro de entrenamientos de fuerza: gratis, sin cuentas, 100% offline y accesible."
    />
    <meta name="twitter:image" content="./pwa-512.png" />

    <title>TMPL — Tu cuaderno de gimnasio</title>

    <!-- Datos estructurados: app de salud gratuita (rich results en buscadores). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TMPL",
        "alternateName": "TMPL — Tu cuaderno de gimnasio",
        "description": "Registro de entrenamientos de fuerza: gratis, sin cuentas, 100% offline y accesible (WCAG 2.2 AA). Rutinas ilimitadas, historial completo, nutrición y export de datos.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any (PWA)",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>TMPL necesita JavaScript para funcionar. Actívalo en tu navegador, por favor.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
